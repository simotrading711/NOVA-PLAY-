name: Build NOVA PLAY APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'NOVA_PLAY_GENRAL_STYLE_UPDATE.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12.0
          accept-android-sdk-licenses: true
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract NOVA PLAY project
        run: |
          test -f NOVA_PLAY_GENRAL_STYLE_UPDATE.zip
          mkdir -p extracted
          unzip -q NOVA_PLAY_GENRAL_STYLE_UPDATE.zip -d extracted
          test -f extracted/NovaPlayAndroid/app/build.gradle
          test -f extracted/NovaPlayAndroid/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: extracted/NovaPlayAndroid
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PLAY-debug-apk
          path: extracted/NovaPlayAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
