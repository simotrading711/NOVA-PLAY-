name: Build NOVA PLAY APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory is not available."
            exit 1
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract NOVA PLAY project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="NOVA_PLAY_GENRAL_STYLE_UPDATE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Preferred project ZIP not found: $ZIP"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

          echo "Using archive: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PROJECT_FILE="$(find extracted -type f -path '*/app/build.gradle' -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Could not find app/build.gradle"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$PROJECT_FILE")")"

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: index.html not found in the Android project."
            find "$PROJECT_DIR/app/src/main" -maxdepth 4 -type f | head -100 || true
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $PROJECT_DIR"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PLAY-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
