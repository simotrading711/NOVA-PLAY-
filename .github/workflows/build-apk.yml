name: Build NOVA PLAY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NOVA_PLAY_IMPLAYER_DEFAULT.zip'
      - 'NOVA_PLAY_IMPLAYER_MOBILE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract NOVA PLAY project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f NOVA_PLAY_IMPLAYER_MOBILE.zip ]; then
            ZIP_FILE="NOVA_PLAY_IMPLAYER_MOBILE.zip"
          elif [ -f NOVA_PLAY_GENRAL_STYLE_UPDATE.zip ]; then
            ZIP_FILE="NOVA_PLAY_GENRAL_STYLE_UPDATE.zip"
          else
            echo "ERROR: Upload NOVA_PLAY_IMPLAYER_MOBILE.zip or NOVA_PLAY_GENRAL_STYLE_UPDATE.zip to the repository root (Code page)."
            echo "Files in repository root:"
            ls -la
            exit 1
          fi
          echo "Using $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          if [ -f extracted/NovaPlayAndroid/app/build.gradle ]; then
            echo "PROJECT_DIR=extracted/NovaPlayAndroid" >> "$GITHUB_ENV"
          elif [ -f extracted/app/build.gradle ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          else
            echo "ERROR: ZIP extracted, but app/build.gradle was not found. ZIP layout:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PLAY-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
