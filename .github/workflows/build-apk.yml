
name: Build NOVA PLAY APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK is unavailable."
            exit 1
          fi
          echo "Android SDK: $ANDROID_HOME"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract NOVA PLAY project
        shell: bash
        run: |
          set -euo pipefail

          # الأولوية للملف الجديد الذي يحتوي على تعديلات Xtream
          ZIP_FILE=""

          for f in \
            NOVA_PLAY_XTREAM_ADMIN.zip \
            NOVA_PLAY_ALL_IN_ONE.zip; do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No supported project ZIP found."
            echo "ZIP files in repository:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          unzip -t "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          # ابحث عن مشروع Android داخل الأرشيف
          PROJECT_FILE="$(find extracted -type f \
            \( -path '*/app/build.gradle' \
            -o -path '*/app/build.gradle.kts' \) \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android app Gradle file not found."
            find extracted -maxdepth 8 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$PROJECT_FILE")")"

          echo "Android project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: assets/index.html is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project extracted successfully."

      - name: Build NOVA PLAY APK
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PLAY-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
