
name: Build NOVA PLAY APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory is not available."
            exit 1
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract NOVA PLAY project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="NOVA_PLAY_BLACK_GREEN_UPDATE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found: $ZIP"
            echo "ZIP files available in repository root:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using project archive: $ZIP"

          echo "Checking ZIP integrity..."
          unzip -t "$ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "Searching for Android Gradle project..."
          PROJECT_FILE="$(find extracted -type f \
            -path '*/app/build.gradle' -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE="$(find extracted -type f \
              -path '*/app/build.gradle.kts' -print -quit)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Could not find app/build.gradle or app/build.gradle.kts"
            echo "Files found in the extracted archive:"
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$PROJECT_FILE")")"

          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: Android assets/index.html was not found."
            echo "Checking available project files:"
            find "$PROJECT_DIR/app/src/main" -maxdepth 5 -type f | head -150 || true
            exit 1
          fi

          echo "Checking Android project settings..."
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "WARNING: settings.gradle was not found in project root."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project files detected successfully."

      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Checking available APK files..."
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PLAY-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
