
name: Build NOVA PLAY APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory is not available."
            exit 1
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract NOVA PLAY project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for candidate in \
            "NOVA_PLAY_BLACK_GREEN_UPDATE.zip" \
            "NOVA_PLAY_GENRAL_STYLE_UPDATE.zip"; do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "ERROR: No supported NOVA PLAY ZIP found."
            echo "ZIP files in repository root:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using archive: $ZIP"

          unzip -t "$ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PROJECT_FILE="$(find extracted -type f \
            -path '*/app/build.gradle' -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE="$(find extracted -type f \
              -path '*/app/build.gradle.kts' -print -quit)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle build file not found."
            find extracted -maxdepth 7 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$PROJECT_FILE")")"

          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: Android assets/index.html not found."
            find "$PROJECT_DIR/app/src/main" -maxdepth 5 -type f | head -150 || true
            exit 1
          fi

          echo "Checking launcher icon files..."
          find "$PROJECT_DIR/app/src/main/res" -maxdepth 3 \
            \( -iname '*launcher*' -o -iname '*ic_logo*' \) \
            -type f -print || true

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project extracted successfully."

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PLAY-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
